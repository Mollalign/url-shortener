version: "3.9"

services:

  backend:
    build: ./backend

    ports:
      - "8000:8000"

    env_file:
      - backend/.env

    depends_on:
      - db
      - redis

  db:
    image: postgres:17

    environment:
      POSTGRES_DB: url_shortener
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

  redis:
    image: redis:8

    ports:
      - "6379:6379"